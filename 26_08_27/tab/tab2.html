<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      ul {
        list-style: none;
      }

      .tab {
        border: 1px solid #000;
        width: 302px;
        margin: 50px auto 0;
      }

      .tab_menu {
        display: flex;
        margin-bottom: 10px;
        width: 100%;
        height: 45px;
        background-color: beige;
      }

      .tab_menu li {
        width: 100px;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 15px;
        cursor: pointer;
      }

      .tab_menu li.on {
        background-color: darkseagreen;
        font-weight: bold;
        color: #fff;
      }

      .tab_list li {
        display: none;
        padding: 10px 20px 20px 20px;
        font-size: 14px;
        line-height: 1.7;
      }

      .tab_list li.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="tab">
      <ul class="tab_menu">
        <li class="on">공지사항</li>
        <li>갤러리</li>
        <li>정보마당</li>
      </ul>
      <ul class="tab_list">
        <li class="on">
          <div>공지사항입니다.</div>
          <div>공지사항입니다.</div>
          <div>공지사항입니다.</div>
          <div>공지사항입니다.</div>
        </li>
        <li>
          <div>갤러리입니다.</div>
          <div>갤러리입니다.</div>
          <div>갤러리입니다.</div>
          <div>갤러리입니다.</div>
        </li>
        <li>
          <div>정보마당입니다.</div>
          <div>정보마당입니다.</div>
          <div>정보마당입니다.</div>
          <div>정보마당입니다.</div>
        </li>
      </ul>
    </div>
  </body>
</html>

<script>
  $(function () {
    let menu = $(".tab_menu li");
    let content = $(".tab_list li");

    menu.on("click", function () {
      let thisIndex = $(this).index();

      menu.removeClass("on");
      menu.eq(thisIndex).addClass("on");

      content.removeClass("on");
      content.eq(thisIndex).addClass("on");
    });
  });
</script>
