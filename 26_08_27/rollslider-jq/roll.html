<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      li {
        list-style: none;
        float: left;
        width: 80px;
      }

      li img {
        width: 80px;
        height: 54px;
        display: block;
      }

      h1 {
        text-align: center;
      }

      #banner_wrap {
        width: 260px;
        height: 120px;
        padding: 10px 20px;
        margin: 0 auto;
        border: 1px solid #aaa;
      }

      #banner {
        width: 800px;
        height: 54px;
      }

      #frame {
        position: relative;
        width: 232px;
        height: 54px;
        margin: 10px auto;
        border: 1px solid blue;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <h2>롤링 슬라이더 배너 만들기</h2>
    <div id="banner_wrap">
      <div id="frame">
        <ul id="banner">
          <li>
            <a href="#"><img src="images/pic_1.jpg" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="images/pic_2.jpg" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="images/pic_3.jpg" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="images/pic_4.jpg" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="images/pic_5.jpg" alt="" /></a>
          </li>
        </ul>
      </div>
      <p>
        <a href="#" class="prev"><img src="images/prev_btn.png" alt="" /></a>
        <a href="#" class="next"><img src="images/next_btn.png" alt="" /></a>
      </p>
    </div>

    <script>
      // let list = document.getElementById("banner"); // li를 감싸는 너비 800px
      // let listLi = document.querySelectorAll("#banner li"); // 사진을 감싸는 li
      // 1# let total = listLi.length; // 5개
      let total = $("#banner li").length;

      // let liWidth = 80;
      // let li_width = document.querySelector('#banner>li').offsetWidth; => 80
      // '#banner>li' 중 첫 번째 선택, .offsetWidth; 한 개의 너비
      let liWidth = $("#banner li").eq(0).width(); //80
      // $("#banner li").eq(0).css("width"); > 80px, 문자가 포함되어 연산 불가
      // parseInt($("#banner li").eq(0).css("width")) > 80px > 80으로 변환

      // 사진 복사 후 추가
      // for (let i = 0; i < 3; i++) {
      //   let copyObj = listLi[i].cloneNode(true);
      //   list.append(copyObj);
      // }
      let copy1 = $("#banner li:lt(3)").clone(); // li 중 3보다 작은 index 번호(0, 1, 2) 복사
      $("#banner").append(copy1); // banner의 맨 뒤에 복사한 요소 추가

      // let next = document.querySelector(".next");
      // let prev = document.querySelector(".prev");
      let num = 0;
      // next.addEventListener("click", (e) => {
      //   e.preventDefault();
      //   if (num === 5) {
      //     num = 0;
      //     list.style.transition = "none";
      //     list.style.marginLeft = 0;
      //   }

      // setInterval > 계속 실행
      // setTimeout > 한 번만 실행
      // 처음 위치로 이동했다가 다시 움직이는 과정을 보여주어야하는데 그럴 틈이 없음
      // marginLeft = 0 > -80으로 변하는 두 작업이 거의 한 번에 변경
      // setTimeout(() => {
      //   num++;
      //   list.style.transition = "margin-left 0.5s"; // 0으로 돌아갈 시간을 벌어줌
      //   list.style.marginLeft = -liWidth * num + "px";
      // }, 50);

      $(".next").on("click", (e) => {
        e.preventDefault();
        if (num === 5) {
          num = 0;
          $("#banner").css("margin-left", "0");
          // transition, animation 없음 첫 번째 사진으로 순간적 이동
        }
        num++;
        $("#banner")
          .stop()
          .animate({ "margin-left": -liWidth * num }, 500); // -80, -160, -240, -320, -400
      });

      $(".prev").on("click", (e) => {
        e.preventDefault();

        if (num === 0) {
          num = 5;
          $("#banner").css("margin-left", -liWidth * num); // 400
        }
        num--;
        $("#banner")
          .stop()
          .animate({ "margin-left": -liWidth * num }, 500);
      });

      // setInterval(() => {
      //   if (num === 5) {
      //     num = 0;
      //     $("#banner").css("margin-left", "0");
      //     // transition, animation 없음 첫 번째 사진으로 순간적 이동
      //   }
      //   num++;
      //   $("#banner")
      //     .stop()
      //     .animate({ "margin-left": -liWidth * num }, 500); // -80, -160, -240, -320, -400
      // }, 2000);

      function autoPlay() {
        if (num === 5) {
          num = 0;
          $("#banner").css("margin-left", "0");
          // transition, animation 없음 첫 번째 사진으로 순간적 이동
        }
        num++;
        $("#banner")
          .stop()
          .animate({ "margin-left": -liWidth * num }, 500); // -80, -160, -240, -320, -400
      }

      let Id = setInterval(autoPlay, 2000);

      $("#banner").mouseenter(function () {
        clearInterval(Id); // 마우스 올리면 멈춤
      });

      $("#banner").mouseleave(function () {
        Id = setInterval(autoPlay, 2000);
      });

      // const autoPlay = () => {
      //   if (num === 5) {
      //     num = 0;
      //     list.style.transition = "none";
      //     list.style.marginLeft = 0;
      //   }

      //   // setInterval > 계속 실행
      //   // setTimeout > 한 번만 실행
      //   // 처음 위치로 이동했다가 다시 움직이는 과정을 보여주어야하는데 그럴 틈이 없음
      //   // marginLeft = 0 > -80으로 변하는 두 작업이 거의 한 번에 변경
      //   setTimeout(() => {
      //     num++;
      //     list.style.transition = "margin-left 0.5s"; // 0으로 돌아갈 시간을 벌어줌
      //     list.style.marginLeft = -liWidth * num + "px";
      //   }, 50);
      // };

      // setInterval(autoPlay, 3000);
    </script>
  </body>
</html>
