<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var num = prompt("1~12 사이의 숫자를 입력하세요.", "");
      var month;

      if (num >= 3 && num <= 5) {
        month = "봄";
        document.write("계절은 " + month + "입니다");
      } else if (num >= 6 && num <= 8) {
        month = "여름";
        document.write("계절은 " + month + "입니다");
      } else if (num >= 9 && num <= 11) {
        month = "가을";
        document.write("계절은 " + month + "입니다");
      } else if (num == 12 || num == 1 || num == 2) {
        month = "겨울";
        document.write("계절은 " + month + "입니다");
      } else {
        document.write("1~12까지의 숫자만 입력해주세요.");
      }
    </script>
  </body>
</html>
