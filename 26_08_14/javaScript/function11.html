<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 일반 함수
      function add(a, b) {
        return a + b;
      }

      // 익명 함수 (화살표 함수)
      const addArrow = (a, b) => {
        return a + b;
      };

      // 리액트에서 가장 많이 쓰임
      // 리턴 값이 한 줄이면 중괄호, return 생략 가능
      const addShort = (a, b) => a + b; // 축약
      document.write(add(7, 10) + "<br>");
      document.write(addArrow(5, 8) + "<br>");
      document.write(addShort(9, 17) + "<br>");
    </script>
  </body>
</html>
