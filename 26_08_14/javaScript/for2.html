<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 1부터 100까지의 합

      var sum = 0;

      for (var i = 1; i <= 100; i++) {
        sum += i;
        document.write("누적 상황 : " + sum + "<br>");
      }
      document.write("1~100까지의 합 : " + sum);
    </script>
  </body>
</html>
