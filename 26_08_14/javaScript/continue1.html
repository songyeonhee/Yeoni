<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num;
      for (num = 1; num <= 10; num++) {
        if (num == 4) {
          continue; // 1, 2, 3, 5, 6, 7, 8, 9, 10,
          // num == 4의 조건이 참이 될 때 continue를 만나면 해당 내용을 수행하지 않고 다시 복귀
        }
        document.write(num, ", ");
      }
    </script>
  </body>
</html>
