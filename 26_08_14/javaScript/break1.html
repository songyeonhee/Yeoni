<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num;
      for (num = 1; num <= 10; num++) {
        if (num == 4) {
          break; // 1, 2, 3, 
          // num == 4의 조건이 참이 될 때 break를 만나면 더 이상 수행하지 않고 빠져나옴.
        }
        document.write(num, ", ");
      }
    </script>
  </body>
</html>
