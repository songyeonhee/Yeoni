<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var mul;
      var i = 2;
      document.write("[ " + i + "단 ] <br> ");

      for (var j = 1; j <= 9; j++) {
        mul = 2 * j;
        // document.write(i + " X " + j + " = " + mul + "<br>");

        // 템플릿 리터럴 방식
        // 변수는 무조건 ${변수명}
        // 따옴표 및 쌍따옴표는 생략
        // 전체를 백틱으로 감쌈

        // document.write(`${i} X ${j} = ${mul}<br>`);
        document.write(`${i} X ${j} = ${i * j}<br>`);
      }
    </script>
  </body>
</html>
