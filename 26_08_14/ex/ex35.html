<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let day = 2;
      let result;

      switch (day) {
        case 1:
          result = "월";
          break;

        case 2:
          result = "화";
          break;

        case 3:
          result = "수";
          break;

        default:
          result = "기타";
          break;
      }

      console.log(`${result}요일 입니다.`);
    </script>
  </body>
</html>
