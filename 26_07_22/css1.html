<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- head 내에 <style> 태그를 사용하여 적용 -->
    <style>
      h1 {
        color: salmon;
      }
    </style>
  </head>

  <body>
    <h1>head에 직접 작성</h1>
    <!-- 인라인 스타일 : HTML 요소 내에 style 속성을 직접 작성 -->
    <p style="color: coral; font-size: 30px">인라인 스타일</p>
  </body>
</html>
