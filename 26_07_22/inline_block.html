<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .container {
        padding: 10px;
        width: 1050px;
        border: 1px solid;
      }

      .box {
        padding-top: 10px;
        width: 330px;
        height: 260px;
        border: 1px solid black;
        text-align: center;
        display: inline-block;
      }

      .box img {
        width: 300px;
        height: 200px;
        border-radius: 5px;
      }

      .text1 .p1 {
        font-weight: bold;
        padding-bottom: 7px;
      }

      .text1 .p2 {
        font-size: 12px;
      }

      .text1 .p2 span {
        padding: 3px;
        margin-right: 10px;
        background-color: pink;
        color: hotpink;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <!-- div.box.box1 + tab -->
    <div class="container">
      <div class="box box1">
        <img src="imgs/cat1.jpg" alt="cat1" />
        <div class="text1">
          <p class="p1">나만 고양이 없어</p>
          <p class="p2"><span>공양이 짱 귀여워</span>엉엉</p>
        </div>
      </div>

      <div class="box box2">
        <img src="imgs/cat2.jpg" alt="cat2" />
        <div class="text1">
          <p class="p1">나만 고양이 없어</p>
          <p class="p2"><span>그루밍 냥이</span>그루미그루미</p>
        </div>
      </div>

      <div class="box box3">
        <img src="imgs/cat3.jpg" alt="cat3" />
        <div class="text1">
          <p class="p1">나만 고양이 없어</p>
          <p class="p2"><span>낼룸 냥이</span>낼루미낼루미</p>
        </div>
      </div>
    </div>
  </body>
</html>
