<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      // 모달 윈도우
      var age = prompt("당신의 나이는?", ""); // 나이를 입력하는 창 출력
      document.write("당신의 나이는 " + age + "세 입니다."); // 화면에 출력

      console.log("당신의 나이는 " + age + "세 입니다."); // 콘솔에 출력
      // 관리자(프로그래머) 테스트용

      var k = confirm("실행함");
      document.write(k); // 확인 > true, 취소 > false
      // if문을 활용하여 프로그램 작성 가능

      alert("학생을 추가했습니다."); // 팝업창 > 어떠한 결과를 확인해주는 창
      // if문과 함께 많이 사용
    </script>
  </head>
  <body>
    <script></script>
  </body>
</html>
