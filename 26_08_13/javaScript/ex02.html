<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      // 자바스크립트 변수 선언은 정수, 실수, 문자를 가리지 않음

      // var 변수 선언 > 정수, 실수, 문자를 가리지 않음
      // 오래된 브라우저 지정 (익스플로어)
      // 함수 단위 스코프
      // es6(2015) 이전부터 사용하던 변수
      var num1 = 10;
      var num2 = 20;

      // 현재는 let, const가 주로 쓰인다.
    </script>
  </head>
  <body>
    <script>
      //   document.write(num1 + num2);
      document.write(num1 + " + " + num2 + " = " + (num1 + num2));
    </script>
  </body>
</html>
