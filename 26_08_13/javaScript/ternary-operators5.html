<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>삼항 비교 연산자</title>
  </head>
  <body>
    <script>
      var a = 10;
      var b = "10";
      var result1 = a == b ? "같다" : "다르다"; // 같다
      var result2 = a === b ? "같다" : "다르다"; // 다르다 > 데이터 타입까지 비교
      console.log(result1);
      console.log(result2);
    </script>
  </body>
</html>
