<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      var num1 = 20;
      num1 = 30;
      document.write(num1 + "<br/>");

      var num1 = 20;
      var num2 = 30;
      document.write(num2 + "<br/>");

      let num3 = 20; // 재할당 가능
      num3 = 30;
      document.write(num3 + "<br/>");

      let num4 = 20;
      // let num4 = 30; 같은 변수명으로 중복 선언은 불가
      document.write(num4 + "<br/>");

      const num5 = 5;
      // num5 = 40; 자바 final(상수) 취급 > 변경(재할당), 중복 선언 불가
      document.write(num5 + "<br/>");
    </script>
  </head>
  <body>
    <script></script>
  </body>
</html>
