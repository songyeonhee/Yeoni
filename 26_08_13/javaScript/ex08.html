<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var num1 = 20;
      var num2 = 7;

      var score1 = num1 + num2;
      var score2 = num1 - num2;
      var score3 = num1 * num2;
      var score4 = num1 / num2;
      console.log(score1 + ", " + score1 + ", " + score3 + ", " + score4);

      // 짝수 예제
      var evenOdd = 7;
      var result = evenOdd % 2;
      var coment;

      if (result === 0) {
        coment = evenOdd + "는 짝수입니다.";
      } else {
        coment = evenOdd + "는 홀수입니다.";
      }
      console.log(coment);

      var increase = 0;
      var add = 0;

      ++increase; // 1
      document.write(increase + "<br/>");

      increase++; // 2
      document.write(increase + "<br/>");

      add = ++increase; // 전위 증가 > 3, 3
      document.write(add + ", " + increase + "<br/>");

      add = increase++; // 후위 증가 > 3, 4
      document.write(add + ", " + increase + "<br/>");
    </script>
  </body>
</html>
