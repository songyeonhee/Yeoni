<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let user = {
        name: "홍길동",
        age: 25,
        city: "서울",
      };

      // Object.keys
      let keys = Object.keys(user);
      console.log(keys); //Array(3) 0:"name" 1:"age" 2:"city"

      keys.forEach((key) => {
        console.log(`${key} : ${user[key]}`);
      });
    </script>
  </body>
</html>
