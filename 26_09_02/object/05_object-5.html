<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let user = {
        name: "홍길동",
        age: 25,
        greet1: function () {
          return `안녕하세요, ${this.name}님`;
        },
        greet2() {
          return `안녕하세요, ${this.name}님`;
          // 메서드 단축 문법
        },
      };

      console.log(user.greet1());
      console.log(user.greet2()); // 안녕하세요, 님
    </script>
  </body>
</html>
