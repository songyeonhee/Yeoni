<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>javaScript에서 map()이란?</h1>
    <h3>
      배열의 각 요소를 하나씩 꺼내 원하는 작업을 수행한 후 <br />
      그 결과를 새로운 배열로 만들어주는 메서드
    </h3>
    <pre>
      const 새로운 배열 = 배열.map(function(요소) {
        return 결과;
      });

      const 새로운 배열 = 배열.map((요소) => {
        return 결과;
      });
    </pre>

    <script>
      // 객체 리터럴
      const users = [
        { name: "홍길동", age: 25 },
        { name: "이몽룡", age: 20 },
        { name: "성춘향", age: 22 },
      ];

      console.log(users[0].name); // 추천
      console.log(users[0]["name"]);

      // map으로 이름만 추출
      const names = users.map((user) => user.name);
      console.log(names);

      // 새로운 배열 ... 전개 연산자
      const newUsers = users.map((user) => ({
        ...user, // 기존 배열의 객체가 가지고 있는 모든 속성(name, age) 전개 연산자(...)로 복사
        age: user.age + 1, // 특정 속성(age)만 1씩 증가
        // 복사한 속성에 age값만 기존 나이에 1을 더한 값으로 덮어씀
      })); // 수정된 새로운 객체 배열을 만드는 코드

      // ()=> ({....})
      // 화살표 함수 뒤에 바로 객체를 반환할 때, 자바 스크립트가 이를 함수의 블록 코드로
      // 오해하지 않도록 소괄호로 감싸 객체 리터럴임을 명시해준 것

      console.log(newUsers);
    </script>
  </body>
</html>
