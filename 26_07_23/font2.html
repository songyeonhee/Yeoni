<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Noto+Sans+KR:wght@100..900&display=swap"rel="stylesheet");
      .p1 {
        font-family: "Nanum Gothic", sans-serif;
        font-size: 40px;
        font-weight: 100;
        font-style: normal;
      }
      .p2 {
        font-family: "Nanum Gothic", sans-serif;
        font-size: 40px;
        font-weight: 300;
        font-style: normal;
      }
      .p3 {
        font-family: "Nanum Gothic", sans-serif;
        font-size: 40px;
        font-weight: 500;
        font-style: normal;
      }
      .p4 {
        font-family: "Nanum Gothic", sans-serif;
        font-size: 40px;
        font-weight: 700;
        font-style: normal;
      }
      .p5 {
        font-family: "Nanum Gothic", sans-serif;
        font-size: 40px;
        font-weight: 900;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <!-- font2.html 내에 나눔 고딕으로 font-weight별로 설정 -->

    <p class="p1">나눔 고딕</p>
    <p class="p2">나눔 고딕</p>
    <p class="p3">나눔 고딕</p>
    <p class="p4">나눔 고딕</p>
    <p class="p5">나눔 고딕</p>

</html>
