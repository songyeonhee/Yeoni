<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .c1 {
        color: red;
      }
      .c2 {
        /* color:#ff0000; 반복되는 수는 한 번만 작성해도 된다. */
        color: #f00;
      }
      .c3 {
        color: rgb(255, 0, 0);
      }
      .c4 {
        color: rgb(0, 0, 0);
      }
      .c5 {
        color: rgb(0, 0, 0, 0.5);
        /* 50% 투명한 검정색 */
      }
      .c6 {
        width: 100px;
        height: 100px;
        border: 1px solid #333;
        background-color: rgba(255, 0, 0, 0);
      }
      .c6:hover {
        background-color: rgba(255, 0, 0, 0.5);
        /* rgb"a" : 불투명도, 0~1 사이의 값을 넣음*/
      }
    </style>
  </head>
  <body>
    <p class="c1">색상을 알아보자</p>
    <p class="c2">색상을 알아보자</p>
    <p class="c3">색상을 알아보자</p>
    <p class="c4">색상을 알아보자</p>
    <p class="c5">색상을 알아보자</p>
    <p class="c6">색상을 알아보자 아무 글씨나 써보자</p>
  </body>
</html>
