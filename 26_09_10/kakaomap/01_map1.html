<!doctype html>
<html>

    <title>Kakao 지도 시작하기</title>
  </head>
  <body>
    <div id="map" style="width: 500px; height: 400px"></div>

      type="text/javascript"
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=166705fedac415a7e3c1aa8fa8e76d66"
    ></script>
    <script>
      var container = document.getElementById("map");
      var options = {
        center: new kakao.maps.LatLng(37.485856, 126.897438),
        level: 3,
      };

      var map = new kakao.maps.Map(container, options);
    </script>
