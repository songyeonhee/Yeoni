<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        height: 3000px;
      }
      .box {
        width: 150px;
        height: 150px;
        /* position: static 아무 포지션 없음, 기본 값, 생략 가능, 박스가 겹치지 않음 */
      }

      .box1 {
        background-color: lavender;
      }

      .box2 {
        background-color: gainsboro;
      }

      .box3 {
        position: fixed;
        bottom: 50px;
        right: 50px;
        background-color: lavenderblush;
      }

      /* fixed
        1) 스크롤해도 항상 같은 자리에 위치
        3) 자리 값 없음
        4) 겹치는 속성
        5) left top right bottom으로 이동 가능 */

      .box4 {
        background-color: lightpink;
      }
    </style>
  </head>

  <body>
    <div class="box box1">박스 1</div>
    <div class="box box2">박스 2</div>
    <div class="box box3">박스 3</div>
    <div class="box box4">박스 4</div>
  </body>
</html>
