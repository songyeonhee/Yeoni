<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .cf::after {
        content: "";
        display: block;
        clear: both;
      } /* 해당 문구 생성 후 필요한 곳 HTML에 cf 추가. */

      .cont1 {
        width: 500px;
        border: 1px solid #333;
        background-color: lavenderblush;
        /* overflow: hidden; float는 높이가 무조건 깨지기 때문에 높이 생성*/
        padding: 20px;
      }

      .box {
        float: left; /* 부모 요소에 높이를 직접 지정 or overflow: hidden; */

        width: 100px;
        height: 100px;
        background-color: lemonchiffon;
        margin-right: 60px;
      }

      .cont2 {
        width: 500px;
        height: 200px;
        border: 1px solid #333;
        margin-top: 50px;
        background-color: lavender;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }

      .box-2 {
        width: 100px;
        height: 100px;
        background-color: mistyrose;
      }

      .cont3 {
        width: 500px;
        height: 200px;
        border: 1px solid #333;
        margin-top: 50px;
        background-color: lavender;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /* 3번 반복하고 비율은 1:1 */
        align-items: center;
        justify-items: center;
      }

      .box-3 {
        width: 100px;
        height: 100px;
        background-color: mistyrose;
      }

      .cont4 {
        width: 500px;
        height: 200px;
        border: 1px solid #333;
        margin-top: 50px;
        background-color: lavender;
        position: relative; /* 기준점 설정 */
      }

      .box-4 {
        position: absolute;
        width: 100px;
        height: 100px;
        background-color: mistyrose;
      }

      .cont4 .box3 {
        right: 50px;
        top: 50px;
      }

      .cont4 .box1 {
        left: 50px;
        top: 50px;
      }

      .cont4 .box2 {
        left: 50%;
        top: 50%;
        margin-left: -50px;
        margin-top: -50px;
      }
    </style>
  </head>

  <body>
    <div class="content cont1 cf">
      <box class="box box1">박스 1</box>
      <box class="box box2">박스 2</box>
      <box class="box box3">박스 3</box>
    </div>

    <div class="content cont2">
      <box class="box-2 box1">박스 1</box>
      <box class="box-2 box2">박스 2</box>
      <box class="box-2 box3">박스 3</box>
    </div>

    <div class="content cont3">
      <box class="box-3 box1">박스 1</box>
      <box class="box-3 box2">박스 2</box>
      <box class="box-3 box3">박스 3</box>
    </div>

    <div class="content cont4">
      <box class="box-4 box1">박스 1</box>
      <box class="box-4 box2">박스 2</box>
      <box class="box-4 box3">박스 3</box>
    </div>
  </body>
</html>
