<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/jquery.bxslider.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/jquery.bxslider.min.js"></script>
    <script src="js/main.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="left-pop-slide">
        <ul class="bxslider1">
          <li>
            <a href="#"><img src="imgs/s1.jpg" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/s2.jpg" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/s3.jpg" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/s4.jpg" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/s5.png" alt="" /></a>
          </li>
        </ul>
        <div class="slide-number">
          <span id="current-slide-number">1</span> /
          <span id="total-slide-number">5</span>
        </div>
        <p><a href="#" class="pause"></a></p>
        <p class="arrow">
          <a href="#" class="prev-btn"></a>
          <a href="#" class="next-btn"></a>
        </p>
      </div>

      <!-- 과제 영역 -->
      <div class="slide-control">
        <span><a href="#" class="prev-button"></a></span>
        <span id="current-slide-num">1</span> /
        <span id="total-slide-num">10</span>
        <span><a href="#" class="stop-play"></a></span>
        <span><a href="#" class="next-button"></a></span>
      </div>
      <div class="right-pop-slide">
        <ul class="bxslider2">
          <li>
            <a href="#"><img src="imgs/sn1.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn2.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn3.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn4.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn5.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn6.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn7.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn8.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn9.png" alt="" /></a>
          </li>
          <li>
            <a href="#"><img src="imgs/sn10.jpg" alt="" /></a>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
