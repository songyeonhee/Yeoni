<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="css/jquery.bxslider.css" />
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/jquery.bxslider.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      header {
        width: 960px;
        height: 200px;
        margin: 0 auto;
        background-color: lavenderblush;
      }

      section {
        width: 960px;
        height: 800px;
        margin: 0 auto;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <header>헤더</header>
    <section>
      <ul class="slider">
        <li><img src="img/images(1).jpg" alt="사진 1" /></li>
        <li><img src="img/images(2).jpg" alt="사진 2" /></li>
        <li><img src="img/images(3).jpg" alt="사진 3" /></li>
        <li><img src="img/images(4).jpg" alt="사진 4" /></li>
        <li><img src="img/images(5).jpg" alt="사진 5" /></li>
      </ul>
    </section>

    <script>
      $(function () {
        $(".slider").bxSlider({
          mode: "fade", // 기본은 수평 (좌우)
          // "fade" : 나타났다 사라짐
          // "vertical" : 수직 슬라이드 (위 아래)
          auto: true, // 자동 슬라이드
          speed: 500, // 슬라이드가 넘어가는 데 걸리는 시간
          pause: 2000, // 다음 슬라이드로 넘어가기 전 기다리는 시간
          controls: false, // 좌우 버튼 숨김
          pager: false, // 페이저 숨김
        });
      });

      // https://bxslider.com/options
    </script>
  </body>
</html>
