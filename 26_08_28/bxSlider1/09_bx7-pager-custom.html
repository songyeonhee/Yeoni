<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="css/jquery.bxslider.css" />
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/jquery.bxslider.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      header {
        width: 960px;
        height: 200px;
        margin: 0 auto;
        background-color: lavenderblush;
      }

      section {
        width: 960px;
        height: 800px;
        margin: 0 auto;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <header>헤더</header>
    <section>
      <ul class="slider">
        <li><img src="img/w1.JPG" alt="사진 1" /></li>
        <li><img src="img/w1.JPG" alt="사진 2" /></li>
        <li><img src="img/w3.JPG" alt="사진 3" /></li>
        <li><img src="img/w4.JPG" alt="사진 4" /></li>
        <li><img src="img/w5.JPG" alt="사진 5" /></li>
      </ul>
      <div id="bx-pager" style="text-align: center">
        <a href="" data-slide-index="0"><img src="img/t1.jpg" alt="" /></a>
        <a href="" data-slide-index="1"><img src="img/t2.jpg" alt="" /></a>
        <a href="" data-slide-index="2"><img src="img/t3.jpg" alt="" /></a>
        <a href="" data-slide-index="3"><img src="img/t4.jpg" alt="" /></a>
        <a href="" data-slide-index="4"><img src="img/t5.jpg" alt="" /></a>
      </div>
    </section>

    <script>
      $(function () {
        $(".slider").bxSlider({
          auto: true,
          pagerCustom: "#bx-pager",
        });
      });
    </script>
  </body>
</html>
