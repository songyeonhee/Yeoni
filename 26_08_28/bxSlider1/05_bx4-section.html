<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="css/jquery.bxslider.css" />
    <script src="js/jquery-3.1.1.min.js"></script>
    <script src="js/jquery.bxslider.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
      }

      header {
        width: 960px;
        height: 200px;
        margin: 0 auto;
        background-color: lavenderblush;
      }

      section {
        width: 960px;
        height: 800px;
        margin: 0 auto;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <header>헤더</header>
    <section>
      <ul class="slider">
        <li><img src="img/images(1).jpg" alt="사진 1" title="메인 사진1" /></li>
        <li><img src="img/images(2).jpg" alt="사진 2" title="메인 사진2" /></li>
        <li><img src="img/images(3).jpg" alt="사진 3" title="메인 사진3" /></li>
        <li><img src="img/images(4).jpg" alt="사진 4" title="메인 사진4" /></li>
        <li><img src="img/images(5).jpg" alt="사진 5" title="메인 사진5" /></li>
      </ul>
    </section>

    <script>
      $(function () {
        $(".slider").bxSlider({
          auto: true, // 자동 슬라이드
          captions: true, // 이미지의 title 속성 내용을 캡션으로 표시
          autoControls: true, // 자동 재생 제어 버튼(Stop + Start) 표시
        });
      });
    </script>
  </body>
</html>
