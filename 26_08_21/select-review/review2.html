<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <a href="https://google.com" id="myLink" target="_blank"> 구글 </a>

    <script>
      // Attribute : 속성
      // getAttribute : 속성 값을 읽어옴
      // setAttribute : 속성 값을 지정할 수 있음 (변경)
      const link = document.getElementById("myLink");
      console.log(link.getAttribute("href"));
      console.log(link.getAttribute("target"));

      // href 속성을 네이트로 변경
      link.setAttribute("href", "https://nate.com");

      // target 속성을 self 변경
      link.setAttribute("target", "_self");
      console.log(link.getAttribute("href"));
      console.log(link.getAttribute("target"));
    </script>
  </body>
</html>
