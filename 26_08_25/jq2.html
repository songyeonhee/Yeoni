<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
      // 문서가 준비되면 시작하라
      $(function () {
        // 결과가 같음
        // $("#list1 li:nth-child(even)").css("background-color", "yellow");
        $("#list1 li:odd").css("background-color", "yellow"); // jquery 시작이 0(인덱스 번호)
        $("#list1 li:first").css("color", "red");
        // list1의 li 요소 중 첫 번째 li만 선택
        $("#list1 li:last").css("color", "green");
        // list1의 li 요소 중 마지막 li만 선택

        $("#list1 li").eq(1).css("font-style", "italic");
        // index 번호 1번과 같은(equal) 요소 (두 번쨰)

        $("#list1 li:lt(2)").css("border", "dotted 2px aqua");
        // index 번호 2보다 작은 (lt-less than)

        $("#list1 li:gt(2)").css("border", "dotted 2px purple");
        // index 번호 2보다 큰 (gt-great than)

        $('#list2 li:contains("리스트11")').css("color", "red");
        // list2 li 중 "리스트11"이라는 글자가 포함된 요소만 선택

        $('#list2 li:has("span")').css("color", "aqua");
        // list2 li 중 span 태그가 포함된 요소만 선택

        $("#list2 li").find("a").css("background-color", "red"); // 중요

        $(".theTitle").html("<a href='#'>요소 객체 조작</a>");
        $(".obj1").text("리스트_2");

        $("#list3").prepend("<li>list_1</li>"); // 맨 앞에 추가
        $("#list3").append("<li>list_6</li>"); // 마지막 위치에 추가

        $("<li>insertBefore</li>").insertBefore($("#list3 li").eq(4));
        // index 번호 4의 요소(다섯 번째) 이전에 새 요소 추가
        $("<li>insertAfter</li>").insertAfter($("#list3 li").eq(5));
        // index 번호 5의 요소(여섯 번째) 이후에 새 요소 추가

        $(".obj1").clone().appendTo("#list3");
        // obj1을 복사하여 추가

        var k = $("#list3 li").eq(1).attr("class"); // getAttribute('class')
        console.log(k);

        $("#list3 li").eq(1).attr("class", "obj2"); // obj1 > obj2 변경
        $(".obj2").css("background-color", "lavenderblush");
      });
    </script>
  </head>
  <body>
    <div id="wrap">
      <h1>탐색 선택자 및 html조작</h1>
      <h2>탐색 선택자</h2>
      <ul id="list1">
        <li>리스트1</li>
        <li>리스트2</li>
        <li>리스트3</li>
        <li>리스트4</li>
        <li>리스트5</li>
        <li>리스트6</li>
        <li>리스트7</li>
      </ul>
      <ul id="list2">
        <li>리스트8</li>
        <li class="theObj">리스트9</li>
        <li><span>리스트10</span></li>
        <li>리스트11</li>
        <li><a href="#">리스트12</a></li>
        <li>리스트13</li>
        <li>리스트14</li>
      </ul>

      <h2 class="theTitle">html 조작</h2>
      <ul id="list3">
        <li class="obj1">list_2</li>
        <li>list_3</li>
        <li>list_4</li>
        <li>list_5</li>
      </ul>
    </div>
  </body>
</html>
