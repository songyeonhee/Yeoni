<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
  </head>
  <body>
    <p id="textZone">이벤트와 이벤트 핸들러를 연습합니다.</p>
    <button id="btn1">click</button>
    <button id="btn2">mouseover</button>
    <button id="btn3">on</button>

    <div id="listWrap">
      <h3>관련 사이트</h3>
      <ul class="list1" style="display: none">
        <li><a href="#">list1</a></li>
        <li><a href="#">list2</a></li>
      </ul>
    </div>

    <a href="#" class="hover">hover</a>
  </body>
</html>

<script>
  $(function () {
    // 1-1 #btn1 클릭 → #textZone 글자색 blue
    $("#btn1").click(function () {
      $(this).parent("textZone").css("color", "blue");
    });
  });
</script>
