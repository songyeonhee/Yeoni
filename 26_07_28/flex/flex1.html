<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .flex-container {
        width: 700px;
        /* height: 200px; float 설정 시 부모 요소 높이 필요*/
        display: flex;
        /* flex-wrap: nowrap; display: flex;의 기본 값*/
        /* 부모 요소에 자식이 넘쳐도 억지로 한 줄로 표시함 */
        flex-wrap: wrap;
        /* 자식 요소에 설정한 너비를 유지하면서 정렬 */
        /* 자식 요소 설정 크기 그대로 나열되며 넘치면 줄 바꿈 */
        /* flex-wrap: wrap-revers; 역순으로 정렬 */
        background-color: lavenderblush;
      }

      .flex-container > div {
        background-color: #f1f1f1;
        width: 100px;
        margin: 10px;
        text-align: center;
        line-height: 75px;
        font-size: 30px;
        /* float: left; */
      }
    </style>
  </head>
  <body>
    <h1>Flexible Boxes</h1>
    <div class="flex-container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
    </div>
  </body>
</html>
