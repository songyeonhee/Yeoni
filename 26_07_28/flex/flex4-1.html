<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .flex-container {
        background-color: lavenderblush;
        width: 1500px;
        height: 200px;
        display: flex;

        justify-content: space-around;
        /* 좌우(가로) 중앙 정렬 */

        align-items: center;
        /* 위아래(세로) 중앙 정렬 */
      }

      .flex-container > div {
        background-color: lightpink;
        width: 100px;
        margin: 10px;
        text-align: center;
        line-height: 75px;
        font-size: 30px;
        /* float: left; */
      }
    </style>
  </head>
  <body>
    <h1>Flexible Boxes</h1>
    <div class="flex-container">
      <div style="flex-grow: 2">1</div>
      <div style="flex-grow: 3">2</div>
      <div style="flex-grow: 5">3</div>
      <!-- items의 넓이를 비율로 조정 가능하다. -->
    </div>
  </body>
</html>
