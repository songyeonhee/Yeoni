<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="app.js"></script>
  </head>
  <body>
    <header>
      <div class="title">
        <h1>공양이로 우주 정복</h1>
        <img src="imgs/emo.png" alt="" />
      </div>
    </header>
    <div class="tab-menu">
      <div class="tab-link active" data-tab="tab1">1번 냥이</div>
      <div class="tab-link" data-tab="tab2">2번 냥이</div>
      <div class="tab-link" data-tab="tab3">3번 냥이</div>
    </div>
    <div class="main-content">
      <div class="content-box active" id="tab1">
        <div class="img-box img1"></div>
        <div class="text-box">
          <h2>따봉 고양이</h2>
          <p>축하합니다 당신은 따봉 고양이의 행운을 받았습니다.</p>
        </div>
      </div>
      <div class="content-box" id="tab2">
        <div class="img-box img2">
          <img src="imgs/floweCat.jpg" alt="" />
        </div>
        <div class="text-box">
          <h2>꽃을 든 고양이</h2>
          <p>미묘는 석류를 좋아해</p>
        </div>
      </div>
      <div class="content-box" id="tab3">
        <div class="img-box img3">
          <img src="imgs/mushroomCat.jpg" alt="" />
        </div>
        <div class="text-box">
          <h2>버섯 고양이</h2>
          <p>못먹는 감 대신 못먹는 버섯</p>
        </div>
      </div>
    </div>
  </body>
</html>
