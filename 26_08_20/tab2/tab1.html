<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h2 {
        padding: 10px 5px;
        text-decoration: underline;
      }
      .tab-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }

      .tab-buttons .tab-link {
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        background: #eee;
        border-radius: 5px;
        transition: background 0.3s;
      }

      .tab-buttons .tab-link.active {
        background: lightgray;
        color: white;
      }

      .tab-content {
        display: none;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .tab-content.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <h2>탭 메뉴 예제</h2>
    <!-- |data-| 속성은 html 요소에 추가적인 사용자 정의 데이터를 저장 -->
    <!-- data-id, data-price -->
    <div class="tab-buttons">
      <button class="tab-link active" data-tab="tab1">🐈 치즈</button>
      <button class="tab-link" data-tab="tab2">🦝 고등어</button>
      <button class="tab-link" data-tab="tab3">🐾 턱시도</button>
    </div>
    <div id="tab1" class="tab-content active">
      치즈는 활발하고 친화력이 좋습니다.
    </div>
    <div id="tab2" class="tab-content">고등어는 조용하고 소심합니다.</div>
    <div id="tab3" class="tab-content">턱시도는 애교가 많습니다.</div>
    <script>
      const tabLinks = document.querySelectorAll(".tab-link"); // tab-link 클래스가 있는 모든 버튼
      const tabContent = document.querySelectorAll(".tab-content"); // tab-content 클래스가 있는 모든 본문

      tabLinks.forEach((button) => {
        button.addEventListener("click", () => {
          const tabId = button.getAttribute("data-tab"); // tab1, tab2, tab3

          // 모든 버튼을 비활성화
          // tabLinks 내의 버튼을 순회하며 active 클래스 제거
          // tabLinks.forEach((btn) => {
          //   btn.classList.remove("active");
          // });
          tabLinks.forEach((btn) => btn.classList.remove("active"));

          // 클릭한 버튼에만 active 부여
          button.classList.add("active");

          // tabContent를 순회하며 active 클래스 제거
          tabContent.forEach((cont) => cont.classList.remove("active"));

          document.getElementById(tabId).classList.add("active");
        });
      });
    </script>
  </body>
</html>
