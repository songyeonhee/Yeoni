<body>
  <script>
  let today = new Date();

  // alert(today);

  console.log(today);
  console.log(today.getFullYear());
  console.log(today.getMonth()+1); // 1월이 0으로 표기됨
  console.log(today.getDate());
  console.log(today.getDay());// 화요일 2 > 일요일 0 ~ 토요일 6까지 요일에 따라 표시
  </script>
</body>
