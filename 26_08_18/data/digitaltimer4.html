<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

</head>

<body>
  <h1 id="clock">
    <span id="year">0000</span>년
    <span id="month">00</span>월
    <span id="date">00</span>일
    <span id="findDay">0</span>
    <span id="hour">00</span>시
    <span id="minute">00</span>분
    <span id="second">00</span>초
  </h1>

  <script>
    function autotime() {
      var today = new Date();
      var year = today.getFullYear();
      var month = today.getMonth() + 1;
      var date = today.getDate();
      var day = today.getDay();

    // 가장 좋은 방법 : 배열 사용
      let dayArray = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
      var findDay = dayArray[day];

      var hour = today.getHours();
      var min = today.getMinutes();
      var sec = today.getSeconds();

      document.getElementById("year").innerHTML = year; // HTML id = year에 변수 year에 저장된 내용 반영
      document.getElementById("month").innerHTML = month;
      document.getElementById("date").innerHTML = date;
      document.getElementById("findDay").innerHTML = findDay;
      document.getElementById("hour").innerHTML = hour;
      document.getElementById("minute").innerHTML = min;
      document.getElementById("second").innerHTML = sec; }

    setInterval(autotime, 1000);
  </script>
</body>
</html>
