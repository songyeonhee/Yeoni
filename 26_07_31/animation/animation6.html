<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>animation6</title>
    <style>
      #myball1 {
        position: relative;
        width: 100px;
        height: 100px;
        border: 1px solid#333;
        border-radius: 50px;
        background: url(img/f1.png) no-repeat 50% 50%;
        animation: myani1 3s forwards;
        /* 기본 : 애니메이션 효과가 끝나면 맨 처음 상태로로 돌아감
        forwords : 효과가 끝난 자리에서 종료 */
      }

      /* 시간을 나눔 */
      @keyframes myani1 {
        0% {
          /* 0초에는 */
          left: 10px;
        }
        100% {
          /* 3초에는 */
          left: 500px;
        }
      }

      #myball2 {
        position: relative;
        width: 100px;
        height: 100px;
        border: 1px solid#333;
        border-radius: 50px;
        background: url(img/f1.png) no-repeat 50% 50%;
        animation: myani2 3s forwards linear;
        /* linear : 일정한 속도 */
      }

      @keyframes myani2 {
        0% {
          left: 10px;
        }
        100% {
          left: 500px;
        }
      }

      #myball4 {
        position: relative;
        width: 100px;
        height: 100px;
        border: 1px solid#333;
        border-radius: 50px;
        background: url(img/f1.png) no-repeat 50% 50%;
        animation: myani3 3s forwards ease-out;
        /* linear : 일정한 속도 */
        /* ease : 느림 - 빠름 - 느림 */
        /* ease-out : 빠름 - 느림 */
        /* ease-in : 느림 - 빠름 */
        /* ease-in-out : 매우 느림 - 매우 빠름 - 느림 */
      }

      @keyframes myani4 {
        0% {
          left: 10px;
        }
        100% {
          left: 500px;
        }
      }

      #myball3 {
        position: relative;
        width: 100px;
        height: 100px;
        border: 1px solid#333;
        border-radius: 50px;
        background: url(img/f1.png) no-repeat 50% 50%;
        animation: myani3 3s forwards ease-in-out;
        /* linear : 일정한 속도 */
        /* ease : 느림 - 빠름 - 느림 */
        /* ease-in-out : 빠름 - 느림 */
      }

      /* 시간을 나눔 */
      @keyframes myani3 {
        0% {
          /* 0초에는 */
          left: 10px;
        }
        100% {
          /* 3초에는 */
          left: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div id="myball1"></div>
    <div id="myball2"></div>
    <div id="myball3"></div>
    <div id="myball4"></div>
  </body>
</html>
