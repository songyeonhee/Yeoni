<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>animation5</title>
    <style>
      #myball {
        position: relative;
        width: 100px;
        height: 100px;
        border: 1px solid#333;
        border-radius: 50px;
        background: url(img/f1.png) no-repeat 50% 50%;

        /* 애니메이션 이름, 시간, 반복 횟수 */
        /* animation-name: myani;
        animation-duration: 3s;
        animation-iteration-count: infinite; 
        animation-direction: alternate; */

        animation: myani 3s infinite alternate;
      }

      /* 시간을 나눔 */
      @keyframes myani {
        0% {
          /* 0초에는 */
          left: 10px;
        }
        40% {
          top: 50px;
          background: url(img/f2.png) no-repeat 50% 50%;
        }
        100% {
          /* 3초에는 */
          left: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div id="myball"></div>
  </body>
</html>
