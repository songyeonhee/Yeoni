<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transition2</title>
    <style>
      button {
        padding: 15px 30px;
        background-color: lightsalmon;
        color: white;
        border: none;
        border-radius: 8px;
        transform: scale(1);
        transition: 0.3s;
      }

      button:hover {
        background-color: salmon;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <button type="button">확인</button>
  </body>
</html>
