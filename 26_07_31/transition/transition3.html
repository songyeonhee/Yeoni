<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transition3</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #f5f5f5;
        padding: 30px;
      }

      .container {
        display: flex;
        justify-content: center;
        gap: 20px;
      }

      .card {
        width: 300px;
        background: lavenderblush;
        border: 1px solid #ccc;
        border-radius: 10px;
        overflow: hidden;
        transition: all 0.5s;
      }

      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px gray;
      }

      img {
        width: 100%;
        display: block;
      }

      .text {
        padding: 20px;
      }

      h3 {
        margin-bottom: 10px;
      }

      p {
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="https://picsum.photos/id/238/300/200" alt="" />
        <div class="text">
          <h3>사진 랜덤 뽑기</h3>
          <p>
            뭐가 나올지<br />
            나도 몰라
          </p>
        </div>
      </div>

      <div class="card">
        <img src="https://picsum.photos/id/237/300/200" alt="" />
        <div class="text">
          <h3>사진 랜덤 뽑기</h3>
          <p>
            뭐가 나올지<br />
            나도 몰라
          </p>
        </div>
      </div>

      <div class="card">
        <img src="https://picsum.photos/id/239/300/200" alt="" />
        <div class="text">
          <h3>사진 랜덤 뽑기</h3>
          <p>
            뭐가 나올지<br />
            나도 몰라
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
