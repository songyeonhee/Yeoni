<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>처음 html</title>
  </head>
  <body>
    <!-- 주석 Ctrl + / -->
    안녕하세요 오늘 html 처음 만들어봐요
    <br />
    안녕하세요<br />
    오늘 html 처음 만들어봐요<br />
    <!-- br : 단순 줄 바꿈 태그 -->
    <h1>안녕하세요</h1>
    <h2>안녕하세요</h2>
    <h3>안녕하세요</h3>
    <h4>안녕하세요</h4>
    <h5>안녕하세요</h5>
    <h6>안녕하세요</h6>
    <!-- h1~h6 제목 강조 태그 -->
    <!-- 태그이름 작성 후 탭키 > 태그 자동 생성 -->
    <!-- 라이브 서버 단축키 Alt + L + O -->
    <p>송</p>
    <p>연</p>
    <p>희</p>
    <!-- p : 문단을 나눌 때 사용, 자동 줄바꿈 -->
  </body>
</html>
