<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!doctype html>
    <html lang="ko">
      <head>
        <meta charset="UTF-8" />
        <title>Float & Clearfix</title>

        <style>
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 너비에 padding, border 포함 */
            /* 280px 안에 padding: 20px;과 border: 2px; 포함r */
          }

          body {
            font-family: "Malgun Gothic", sans-serif;
            background: #f4f4f4;
            padding: 40px;
          }

          /* 부모 */
          .container {
            width: 900px;
            margin: 0 auto;
            background: #fff;
            border: 3px solid red;
            padding: 20px;
            display: flex;
            /* flexbox 적용 */
            gap: 15px;
            /* 카드 사이 간격 */
          }

          .card {
            flex: 1;
            /* 3개의 카드가 같은 너비로 정렬 */
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
          }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="card">
            <h2>HTML</h2>
            <p>HTML은 웹페이지의 구조를 만드는 언어입니다.</p>
          </div>

          <div class="card">
            <h2>CSS</h2>
            <p>CSS는 웹페이지의 디자인을 담당합니다.</p>
          </div>

          <div class="card">
            <h2>JavaScript</h2>
            <p>JavaScript는 웹페이지에 동작을 추가합니다.</p>
          </div>
          <!-- <div class="clear"></div> -->
        </div>
      </body>
    </html>
  </body>
</html>
