<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표 연습_3</title>
    <style>
      .container {
        width: 800px;
        border: 1px solid salmon;
        margin: auto;
      }
      table {
        border: 1px solid salmon;
        border-collapse: collapse;
        margin: auto;
      }
      td,
      th {
        border: 1px solid salmon;
        padding: 10px 20px;
        text-align: center;
        /* 텍스트 중앙 정렬, 블럭 요소 내 텍스트는 대부분 인라인 요소*/
      }
      h1,
      h2 {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>레드향</h1>
      <p>껍질에 붉은 빛이 돌아 <strong>레드향</strong>이라 불린다.</p>
      <p>
        레드향은 <em>한라봉과 귤을 교배한</em> 것으로 <br />
        일반 귤보다 2~3배 크고, 과육이 붉고 통통하다
      </p>
      <blockquote>
        <em>비타민C</em>와 <i>비타민D</i>가 풍부해 <br />
        <strong>혈액순환, 감기 예방</strong>등에 좋은 것으로 알려져있다.
      </blockquote>
      <h2>레드향 샐러드 레시피</h2>
      <h2>상품 구성</h2>

      <table>
        <!-- 블럭 요소 -->
        <caption>
          선물용과 가정용 상품 구성
        </caption>
        <colgroup>
          <col style="width: 150px; background-color: pink" />
          <col style="width: 200px" />
          <col style="width: 150px" />
          <col style="width: 150px" />
        </colgroup>
        <thead>
          <tr style="background-color: pink">
            <!-- th : 글자 진하게, 중앙 정렬 -->
            <th>용도</th>
            <th>중량</th>
            <th>개수</th>
            <th>가격</th>
          </tr>
        </thead>
        <!-- 웹 접근성으로 인한 thead/tbody 사용 -->
        <tbody>
          <tr>
            <td rowspan="2">선물용</td>
            <!-- rowspan : 세로 합치기 = "합칠 칸 수" -->
            <!-- colspan : 가로 합치기 -->
            <td>3kg</td>
            <td>11과~16과</td>
            <td>35,000원</td>
          </tr>
          <tr>
            <td>5kg</td>
            <td>18과~26과</td>
            <td>52,000원</td>
          </tr>
          <tr>
            <td rowspan="2">가정용</td>
            <td>3kg</td>
            <td>11과~16과</td>
            <td>30,000원</td>
          </tr>
          <tr>
            <td>5kg</td>
            <td>18과~26과</td>
            <td>47,000원</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
