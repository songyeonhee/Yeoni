<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표 연습_2</title>
    <style>
      table {
        border: 1px solid navajowhite;
        border-collapse: collapse;
        /* 두 개의 선을 하나로 합침 */
      }
      td {
        border: 1px solid navajowhite;
        /* padding: 6px; 안쪽 여백 : 전체 (상 우 하 좌)*/
        padding: 10px 50px;
        /* 상하 + 좌우 */
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        표 제목(캡션)
      </caption>
      <tr>
        <!-- tr : 행(가로), td : 열(세로) -->
        <td>1행 1열</td>
        <td>1행 2열</td>
      </tr>
      <tr>
        <td>2행1열</td>
        <td>2행 2열</td>
      </tr>
    </table>
  </body>
</html>
