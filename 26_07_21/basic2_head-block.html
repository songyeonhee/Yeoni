<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 한글 사용 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 반응형 웹 -->
    <title>Yeoni</title>
    <link rel="icon" href="imgs/fabicon.png" type="image/x-icon" />
    <!-- 파비콘 넣는 방법 (타이틀 탭에 아이콘 삽입) -->
    <meta
      name="description"
      content="ABC 테크는 인공지능 기반의 마케팅 자동화 솔루션 제공"
    />
    <!-- 검색 엔진을 위한 페이지 설명 -->
    <style>
      h1 {
        background-color: darksalmon;
        color: white;
        width: 50%;
      }
    </style>
  </head>
  <body>
    <h1>HTML 기본 구조 예제</h1>
    <h3>문서 특수 문자는 한글 자음 + 한자 키, 예를 들어 'ㅁ' + 한자 키</h3>
    <h5>★ ㄱ~ㅎ까지 존재</h5>
    <h5>또 다른 특수 문자는 '엔티티 코드', 'HTML 특수 문자'로 구글에 검색</h5>
    <h4>HTML 띄어쓰기 > 스페이스 바는 1개 까지만 적용</h4>
    <h5>추가 공백 사용 시 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 엔티티 코드 사용</h5>
    <h5>&lt;!doctype html&gt;은 HTML 문서 상단에 반드시 사용</h5>
    <img src="imgs/entyty.png" alt="엔티티 코드표 " />
    <h5>이모지 Win + '.' 👑🍀🌺</h5>
    <dl>
      <!-- 사용자 정의 목록 -->
      <dt>말티즈</dt>
      <dd>사랑스럽고 시기심 많은 강아지</dd>
      <dt>요크셔테리어</dt>
      <dd>용맹하고 애교 많은 강아지</dd>
    </dl>
  </body>
</html>

<!-- 블럭 요소
 1. 한 줄 전체를 차지함 (넓이가 100%)
 2. 대표적인 블럭 요소 : div, p, h1~h6, ul, ol, li, pre, blockquote, address, dl, dt, dd
 3. 항상 줄 바꿈이 발생함
 4. 넓이(width) 높이(height) 설정 가능
 5. 바깥 여백(margin), 안쪽 여백(padding) 설정 가능
 6. 블럭 요소 안에 인라인 요소, 블럭 요소 포함 가능
 7. 레이아웃 구성에 주로 사용 -->
