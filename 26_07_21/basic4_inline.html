<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 글자 관련 인라인 태그 : 줄 바뀜이 없음 -->
    <p>요즈음은 <strong>반응형</strong> 웹이 대세이다.</p>
    <!-- very important 강조의 의미를 나타내며 웹 접근성과 관련이 있음 -->
    <p>요즈음은 <em>반응형</em> 웹이 대세이다.</p>
    <!-- important 강조의 의미를 나타내며 웹 접근성과 관련이 있음 -->
    <!-- 시멘틱 태그 : 의미를 가진 태그 -->

    <p>요즈음은 <b>반응형</b> 웹이 대세이다.</p>
    <p>요즈음은 <i>반응형</i> 웹이 대세이다.</p>
    <!-- b/i 태그는 웹 접근성이 없어 사용하지 않음 -->

    <ul>
      <!-- href 연결하다 -->
      <li><a href="https://nate.com">네이트가자</a></li>
      <!-- 현재 탭에서 이동 -->

      <li><a href="https://nate.com" target="_blank">네이트가자</a></li>
      <!-- target="_blank" 새 탭으로 열기 -->

      <li><a href="../26_07_20/basic.html" target="_blank">basic 열기</a></li>
      <!-- ../ > 현재 26_07_21에 있는 방 하나를 탈출하여 26_07_20의 경로를 찾음의 의미  -->

      <li><a href="basic2_headBlock.html" target="_blank">basic2 열기</a></li>
    </ul>

    <p>mark 태그는 <mark>형광펜</mark> 역할</p>
    <h2>small 태그는 조금 <small>작게</small> 화면에 표시</h2>
    <p>del 태그는 <del>취소선</del> 역할</p>
    <p>u 태그는 <u>밑 줄</u> 역할</p>
    <!-- 사용하지 않음 -->
    <p>ins 태그는 <ins>접근성 있는 밑 줄</ins> 역할</p>
    <h3>X <sup>2</sup> 윗 첨자</h3>
    <h3>CO <sub>2</sub> 아랫 첨자</h3>
  </body>
</html>
