<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      h1 {
        font-size: 60px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        /* 운영 체제에서 기본으로 지원하는 폰트 */
      }

      .heading {
        text-align: center;
        /* class heading 안에 있는 글자 또는 이미지 세로 중앙 정렬 */
        width: 700px;
        height: 200px;
        line-height: 200px;
        /* 중앙 정렬하고자하는 컨텐츠가 1줄일 때 용이 */
        color: white;
        background-color: #222;
        margin: auto;
        /* class heading 컨텐츠 자체를 중앙 정렬 */
      }
    </style>
  </head>
  <body>
    <h1 class="heading">HTML</h1>
  </body>
</html>
