<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        display: inline-block;
        text-align: center;
        margin: 15px;
        width: 200px;
        height: 100px;
        border-width: 5px;
        line-height: 100px;
        font-size: 20px;
      }

      #dox1 {
        border-style: solid; /* 실선 */
        border-color: lightgreen;
      }

      #dox2 {
        border-style: dotted; /* 점선 */
        border-color: lightcoral;
      }

      #dox3 {
        border-style: dashed; /* 짧은 점선 */
        border-top-color: lightcyan;
      }

      #dox4 {
        border-style: double; /* 이중선 */
        border-color: lightsteelblue;
      }
    </style>
  </head>
  <body>
    <div class="dox1">실선 테두리</div>
    <div class="dox2">점선 테두리</div>
    <div class="dox3">짧은 점선 테두리</div>
    <div class="dox4">이중 테두리</div>
  </body>
</html>
