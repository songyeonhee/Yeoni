<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img src="imgs/cat2.jpg" alt="" width="300" id="photo" />
    <br />

    <button onclick="change()">변경</button>

    <script>
      // setAttribute() > 속성 변경
      // getAttribute() > 속성 읽기

      function change() {
        let img = document.getElementById("photo");
        console.log(img.getAttribute("src")); // src 내용 읽음
        img.setAttribute("src", "imgs/cat1.jpg"); // src에 새로운 이미지 지정
        console.log(img.getAttribute("src"));
      }
    </script>
  </body>
</html>
