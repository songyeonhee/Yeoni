<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!doctype html>
    <html lang="ko">
      <head>
        <meta charset="UTF-8" />
        <title>Float & Clearfix</title>

        <style>
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 너비에 padding, border 포함 */
            /* 280px 안에 padding: 20px;과 border: 2px; 포함r */
          }

          body {
            font-family: "Malgun Gothic", sans-serif;
            background: #f4f4f4;
            padding: 40px;
          }

          /* 부모 */
          .container {
            width: 900px;
            margin: 0 auto;
            background: #fff;
            border: 3px solid red;
            padding: 20px;

            /* 첫 번째 방법 */
            /* overflow: hidden; */
            /* 높이 자동 생성 */

            /* 두 번째 방법 */
            /* height: 165px; */
            /* 높이 직접 입력 */
            /* 계산해야하는 번거로움, 한 번에 맞추기 어려움 */
          }

          .card {
            float: left;
            width: 278px;
            margin-right: 9px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
          }

          .card:nth-child(3) {
            margin-right: 0;
          }
          /* .clear {
            clear: both;
          } */
          /* 비어있는 div 생성 후 clear, 다만 권장되는 방법 아님 */
          /* 줄 바꿈이 되면서 높이 유지 */

          .container::after {
            content: "";
            display: block;
            /* after는 인라인 요소 > 블럭 요소로 변환 */
            clear: both;
          }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="card">
            <h2>HTML</h2>
            <p>HTML은 웹페이지의 구조를 만드는 언어입니다.</p>
          </div>

          <div class="card">
            <h2>CSS</h2>
            <p>CSS는 웹페이지의 디자인을 담당합니다.</p>
          </div>

          <div class="card">
            <h2>JavaScript</h2>
            <p>JavaScript는 웹페이지에 동작을 추가합니다.</p>
          </div>
          <!-- <div class="clear"></div> -->
        </div>
      </body>
    </html>
  </body>
</html>
