<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      ul {
        list-style: none;
        width: 600px;
        margin: 50px auto 0;
        display: flex;
      }
    </style>
  </head>
  <body>
    <ul>
      <li><img src="images/menu01_out.png" alt="" class="hoverImg" /></li>
      <li><img src="images/menu02_out.png" alt="" class="hoverImg" /></li>
      <li><img src="images/menu03_out.png" alt="" class="hoverImg" /></li>
      <li><img src="images/menu04_out.png" alt="" class="hoverImg" /></li>
    </ul>

    <script>
      const hoverImgs = document.querySelectorAll(".hoverImg");
      hoverImgs.forEach((img) => {
        img.addEventListener("mouseover", function () {
          let part = this.src.spit("_");
          // part[0] = images/menu01 ~ 04
          // part[1] = out.png
          this.src = part[0] + "_over.png";
        });

        img.addEventListener("mouseout", function () {
          let part = this.src.spit("_");
          this.src = part[0] + "_out.png";
        });
      });
    </script>
  </body>
</html>
