<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let greenArr = ["교대", "방배", "강남"];
      let yellowArr = ["미금", "정자", "수서"];
      greenArr.splice(2, 1, "서초", "역삼");
      // 인덱스 2번(강남) 삭제 후 뒤에 붙임 > 교대,방배,서초,역삼
      document.write(greenArr + "<br>");

      let data1 = yellowArr.pop(); // 맨 마지막 데이터 저장 > 수서

      let data2 = yellowArr.shift(); // 미금
      yellowArr.push(data2); // 맨 마지막에 넣기

      yellowArr.unshift(data1); // data1 내용을 맨 앞에 밀어넣기
    </script>
  </body>
</html>
